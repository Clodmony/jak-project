# Adapted from OpenGOAL-Mods/OG-Mod-Base .github/workflows/cut-release.yaml (commit 2c4ee857,
# ISC licence, OpenGOAL Team). Changes for this fork (AI-assisted):
# - The binaries are always built from this repository. The co-op mod changes the C++ runtime, so
#   the template's "vanilla" and "modbase" binary sources (prebuilt upstream binaries) were removed.
# - Releases can only be cut from the branches in ALLOWED_BRANCHES, and those branches are passed to
#   the pipeline as `releaseBranches`. Without that, github-tag-action treats every branch except
#   master/main as a pre-release branch, ignores the bump choice and tags v0.0.1-<branch>.N.
# The "Run workflow" button only appears while this file is on the repository's default branch.
# See docs/splitscreen/MOD.md.
name: Cut Mod Release ⭐

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      jak1:
        description: 'Supports Jak 1?'
        required: true
        default: 'true'
        type: boolean
      jak2:
        description: 'Supports Jak 2?'
        required: true
        default: 'false'
        type: boolean
      jak3:
        description: 'Supports Jak 3?'
        required: true
        default: 'false'
        type: boolean
      jakx:
        description: 'Supports Jak X?'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  prep_vars:
    name: "Prep Variables"
    runs-on: ubuntu-latest
    outputs:
      supported_games: ${{ steps.prep-vars.outputs.GAMES }}
      release_branches: ${{ steps.prep-vars.outputs.RELEASE_BRANCHES }}
    steps:
      - name: Prep Variables
        id: prep-vars
        env:
          # Branches a release may be cut from (exact names, space separated).
          ALLOWED_BRANCHES: "master feature/jak1-coop-launcher-mod"
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          GAMES=
          if [[ ${{ inputs.jak1 }} == "true" ]]; then GAMES+=jak1,; fi
          if [[ ${{ inputs.jak2 }} == "true" ]]; then GAMES+=jak2,; fi
          if [[ ${{ inputs.jak3 }} == "true" ]]; then GAMES+=jak3,; fi
          if [[ ${{ inputs.jakx }} == "true" ]]; then GAMES+=jakx,; fi
          GAMES=${GAMES%?}
          echo "GAMES=$GAMES" >> "$GITHUB_OUTPUT"
          RELEASE_BRANCHES=
          ON_RELEASE_BRANCH=false
          for BRANCH in $ALLOWED_BRANCHES; do
            RELEASE_BRANCHES+="^${BRANCH}\$,"
            if [[ "$BRANCH" == "$CURRENT_BRANCH" ]]; then ON_RELEASE_BRANCH=true; fi
          done
          RELEASE_BRANCHES=${RELEASE_BRANCHES%?}
          if [[ "$ON_RELEASE_BRANCH" != "true" ]]; then
            echo "::error::Releases can only be cut from: $ALLOWED_BRANCHES (this run is on '$CURRENT_BRANCH')"
            exit 1
          fi
          echo "RELEASE_BRANCHES=$RELEASE_BRANCHES" >> "$GITHUB_OUTPUT"

  cut_mod_release:
    name: "Cut Mod Release"
    needs: prep_vars
    uses: ./.github/workflows/mod-release-pipeline.yml
    with:
      semverBump: ${{ inputs.bump }}
      metadataSupportedGames: ${{ needs.prep_vars.outputs.supported_games }}
      releaseBranches: ${{ needs.prep_vars.outputs.release_branches }}
      buildBinaries: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
